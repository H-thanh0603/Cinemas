name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinestar
          POSTGRES_PASSWORD: cinestar
          POSTGRES_DB: cinestar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinestar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cinestar:cinestar@localhost:5432/cinestar_test
      AUTH_SECRET: ci-only-secret-not-used-for-real-auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations (same path as production deploy)
        run: npx prisma migrate deploy

      - name: Detect schema drift (migrations vs schema.prisma)
        run: |
          DIFF=$(npx prisma migrate diff --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma --script)
          echo "$DIFF"
          # Allow-list: index pg_trgm được tạo chủ đích bằng raw SQL trong
          # migration fuzzy_search — Prisma schema không diễn đạt được GIN
          # expression index nên luôn hiện ở đây. Mọi khác biệt khác = drift.
          if echo "$DIFF" | grep -E '^(ALTER|CREATE|DROP)' | grep -v 'Movie_title_trgm_idx'; then
            echo "::error::Drift giữa migrations và schema.prisma — hãy tạo migration mới thay vì sửa schema tay"
            exit 1
          fi

      - name: Seed
        run: npx prisma db seed
        env:
          SEED_FORCE_WIPE: "true"

      - name: Unit self-checks (seat scoring, dynamic pricing)
        run: |
          npx tsx scripts/test-seat-scoring.ts
          npx tsx scripts/test-dynamic-pricing.ts

      - name: Middleware auth regression (HTTPS __Secure- cookie)
        run: npx tsx scripts/test-middleware-auth.ts

      - name: Integration tests (booking, concurrency, expiry, schedule)
        run: |
          npx tsx scripts/test-booking.ts
          npx tsx scripts/test-booking-concurrency.ts
          npx tsx scripts/test-future-showtimes.ts
          npx tsx scripts/test-showtime-schedule.ts

      - name: Timezone-safety regression (naive-UTC vs session TZ)
        run: npx tsx scripts/test-timezone-safety.ts

      - name: MCP agent endpoint (dev server + JSON-RPC)
        run: |
          # Start dev server với MCP key + DB CI
          CINEMAS_AGENT_KEY=ci-mcp-key npx next dev -p 3100 &
          DEV_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          BASE_URL=http://localhost:3100 AGENT_KEY=ci-mcp-key \
            npx tsx scripts/test-mcp.ts
          kill $DEV_PID

      - name: Build
        run: npm run build
